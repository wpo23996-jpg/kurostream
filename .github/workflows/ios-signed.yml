name: Build iOS (signed ipa)

# 出「正式签名」的 ipa，可上架 App Store 或用 Ad Hoc 分发。
# 需要 Apple Developer 账号（$99/年）和证书。
#
# 先在 GitHub 仓库 Settings → Secrets and variables → Actions 里建这些 secret：
#   IOS_CERT_P12_BASE64      .p12 证书的 base64
#   IOS_CERT_PASSWORD        证书密码
#   IOS_PROVISION_BASE64     .mobileprovision 的 base64
#   IOS_TEAM_ID               10 位 Team ID
#   IOS_BUNDLE_ID             com.yourcompany.app
#   IOS_KEYCHAIN_PASSWORD     随便设一个临时密码
#
# 生成证书流程（需要一台 Mac 或用 App Store Connect API，见 mobile/IOS.md）

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '服务器地址（https）'
        required: true
      export_method:
        description: '分发方式'
        required: true
        default: 'app-store'
        type: choice
        options:
          - app-store
          - ad-hoc
          - development

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 www
        working-directory: mobile
        env:
          KS_SERVER: ${{ inputs.server_url }}
        run: |
          npm install --no-audit --no-fund
          npm run sync:web

      - name: 生成 iOS 工程
        working-directory: mobile
        env:
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          node -e "
            const fs=require('fs');const p='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.appId=process.env.BUNDLE_ID||c.appId;
            fs.writeFileSync(p,JSON.stringify(c,null,2));
          "
          npx cap add ios
          npx cap sync ios

      - name: 导入签名证书
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_CERT_PASSWORD }}
          KC_PWD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KC_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PWD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 导入描述文件
        env:
          PROV_B64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV_B64" | base64 --decode > /tmp/profile.mobileprovision
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 生成 ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          METHOD: ${{ inputs.export_method }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Archive
        working-directory: mobile/ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            | tail -40

      - name: 导出 ipa
        working-directory: mobile/ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ../../../ExportOptions.plist \
            -exportPath build/ipa \
            | tail -30

      - uses: actions/upload-artifact@v4
        with:
          name: kurostream-ios-signed-${{ github.run_number }}
          path: mobile/ios/App/build/ipa/*.ipa
          retention-days: 30
