name: Build (manual trigger helper)

# 这只是给上面 android.yml 打了个说明入口，不需要单独跑。
on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### 打包入口" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请到 **Actions → Build Android APK → Run workflow**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- `server_url` 填你的站点地址，例如 https://kuro.example.com" >> $GITHUB_STEP_SUMMARY
          echo "- 必须是 https，安卓 9+ 默认禁止明文 HTTP" >> $GITHUB_STEP_SUMMARY
