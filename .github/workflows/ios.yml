name: Build iOS (unsigned ipa)

# 公开仓库的 macOS runner 完全免费，不用 Apple 开发者账号也能出包。
# 产物是「未签名 ipa」，用 Sideloadly / AltStore 配合免费 Apple ID 自签安装（7 天有效）。
# 要出正式签名包请看 ios-signed.yml。

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '服务器地址（必须 https，例如 https://kuro.example.com）'
        required: true
        type: string
      app_name:
        description: '应用显示名'
        required: false
        default: 'KuroStream'
        type: string
      bundle_id:
        description: 'Bundle Identifier（不能和别人重复）'
        required: false
        default: 'com.kurostream.app'
        type: string

jobs:
  build:
    name: 云构建 iOS ipa
    runs-on: macos-13
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 查看环境
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -5
          pod --version || echo "CocoaPods 缺失"

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Ruby 依赖（CocoaPods）
        run: |
          sudo gem install cocoapods --no-document || true

      - name: 生成 www（注入服务器地址）
        working-directory: mobile
        env:
          KS_SERVER: ${{ inputs.server_url }}
        run: |
          npm install --no-audit --no-fund
          npm run sync:web

      - name: 生成 iOS 工程
        working-directory: mobile
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          # 用输入的 bundle id 覆盖 capacitor 配置
          node -e "
            const fs=require('fs');
            const p='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.appId=process.env.BUNDLE_ID || c.appId;
            fs.writeFileSync(p, JSON.stringify(c,null,2));
            console.log('appId =>', c.appId);
          "
          npx cap add ios

      - name: 同步资源并装 Pods
        working-directory: mobile
        run: |
          npx cap sync ios
          cd ios/App && pod install --repo-update || pod install

      - name: 改显示名
        working-directory: mobile/ios/App
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName '${APP_NAME}'" App/Info.plist || true

      - name: 允许 WebView 内联播放（iOS 必须）
        working-directory: mobile/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" App/Info.plist 2>/dev/null || true

      - name: 编译（不签名）
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -60

      - name: 打包成 ipa
        working-directory: mobile/ios/App
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::找不到 $APP_PATH"
            ls -R build/Build/Products | head -40
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry KuroStream-unsigned.ipa Payload
          ls -lh KuroStream-unsigned.ipa
          unzip -l KuroStream-unsigned.ipa | head -8

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kurostream-ios-unsigned-${{ github.run_number }}
          path: mobile/ios/App/KuroStream-unsigned.ipa
          retention-days: 30

      - name: 构建结果
        run: |
          echo "### ✅ iOS 未签名 ipa 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "在本次运行页底部 **Artifacts** 下载 \`kurostream-ios-unsigned-*.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**安装到 iPhone：**" >> $GITHUB_STEP_SUMMARY
          echo "1. Windows 装 [Sideloadly](https://sideloadly.io) + iTunes" >> $GITHUB_STEP_SUMMARY
          echo "2. iPhone 连电脑并信任" >> $GITHUB_STEP_SUMMARY
          echo "3. 把 ipa 拖进 Sideloadly，输入任意 Apple ID" >> $GITHUB_STEP_SUMMARY
          echo "4. 手机上「设置 → 通用 → VPN与设备管理」信任证书" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 免费 Apple ID 签名的 App **7 天后失效**，重新拖一次即可。" >> $GITHUB_STEP_SUMMARY
